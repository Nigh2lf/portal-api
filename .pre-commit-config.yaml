# See https://pre-commit.com for more information
# Instalar:  pip install pre-commit && pre-commit install
# Rodar em todos os arquivos:  pre-commit run --all-files

default_language_version:
  python: python3

repos:
  # ---------------------------------------------------------------------------
  # Higiene básica de arquivos
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ---------------------------------------------------------------------------
  # Lint + format (Ruff substitui flake8/black/isort em um único binário)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # Atualiza sintaxe Python (>= 3.10)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.17.0
    hooks:
      - id: pyupgrade
        args: ["--py310-plus"]

  # ---------------------------------------------------------------------------
  # Atualiza padrões deprecados do Django
  # ---------------------------------------------------------------------------
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.21.0
    hooks:
      - id: django-upgrade
        args: ["--target-version", "4.2"]

  # ---------------------------------------------------------------------------
  # Bloqueia commit de credenciais
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(\.env\.example|.*\.lock|.*\.svg)$

  # ---------------------------------------------------------------------------
  # Análise de segurança em código Python
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-q", "-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(.*/migrations/.*|.*/tests?\.py|.*/tests/.*)$
