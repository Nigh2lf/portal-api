# ============================================================================
# Configuração de ferramentas de qualidade de código.
# Este arquivo NÃO substitui requirements.txt — só configura ruff/bandit/etc.
# ============================================================================

[project]
name = "boilerplate-api-django"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "*/migrations/*",
    "venv",
    "static",
    "media",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "UP",   # pyupgrade
    "S",    # flake8-bandit (subset)
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (já tratado pelo formatter)
    "S101",   # uso de assert (ok em testes)
    "B008",   # function call in default argument (comum em DRF)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "DJ"]
"**/tests.py" = ["S", "DJ"]
"**/settings*.py" = ["S105", "S106"]
"manage.py" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["core", "config"]

[tool.ruff.format]
quote-style = "double"

# ============================================================================
# Bandit
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests", "migrations", "venv", "static", "media"]
skips = [
    "B101",  # assert_used
    "B104",  # hardcoded_bind_all_interfaces (uso comum em Docker)
]

# ============================================================================
# Pytest (+ pytest-django, pytest-mock)
# ============================================================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["core"]
addopts = "-ra --strict-markers"

# ============================================================================
# Commitizen (opcional) — bump de versão + CHANGELOG automatizados.
# Uso: ``cz bump`` (atualiza version em pyproject.toml e core/__init__.py,
#                  cria tag git e atualiza CHANGELOG.md).
# Instale com: pip install commitizen
# ============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = [
    "pyproject.toml:version",
    "core/__init__.py:__version__",
]
