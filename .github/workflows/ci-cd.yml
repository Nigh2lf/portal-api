name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      collectstatic:
        description: "Force collectstatic during deploy (normally only when requirements.txt changed)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DEBUG: "True"
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: portal_test
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      PUBLIC_CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install MySQL client headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest

  deploy:
    name: Deploy to EC2
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_SECURITY_GROUP_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Runner public IP
        id: ip
        run: echo "ip=$(curl -fsS https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Allow runner IP on port 22 (only when AWS_SECURITY_GROUP_ID is set)
        if: env.AWS_SECURITY_GROUP_ID != ''
        run: |
          aws ec2 authorize-security-group-ingress --group-id "$AWS_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "${{ steps.ip.outputs.ip }}/32"
          sleep 5

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull and deploy on the server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd /home/portal-api && git fetch origin main && git checkout -q main && git pull --ff-only origin main \
             && COLLECTSTATIC='${{ inputs.collectstatic }}' bash scripts/deploy.sh '${{ github.sha }}'"

      - name: Revoke runner IP on port 22
        if: always() && env.AWS_SECURITY_GROUP_ID != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$AWS_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "${{ steps.ip.outputs.ip }}/32" || true
