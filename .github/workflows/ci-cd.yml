name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      collectstatic:
        description: "Force collectstatic during deploy (normally only when requirements.txt changed)"
        type: boolean
        default: false

# contents: read for the checkout; id-token: write so the deploy job can assume the AWS role by OIDC.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DEBUG: "True"
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: portal_test
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      PUBLIC_CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install MySQL client headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest

  deploy:
    name: Deploy to EC2 (Systems Manager)
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No `environment:` here: it would change the OIDC `sub` claim to `environment:<name>`,
    # and the role's trust policy matches `ref:refs/heads/main`.
    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_DIR: /home/portal-api
    steps:
      - uses: actions/checkout@v4

      - name: Check repository variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          for name in AWS_ROLE_ARN AWS_REGION EC2_INSTANCE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository variable $name is not set (Settings > Secrets and variables > Actions > Variables). See ci-cd/README.md in the workspace."
              exit 1
            fi
          done

      # The runner assumes the AWS role through OIDC: no AWS key stored in the repository.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through Systems Manager
        run: |
          # SSM runs as root on the server; every command below runs as ubuntu so the
          # checkout keeps its owner. The checkout is updated before scripts/deploy.sh runs.
          bash scripts/ssm-run.sh "deploy portal-api ${GITHUB_SHA::7}" <<EOF
          set -euo pipefail
          cd "$APP_DIR"
          if [ -n "\$(sudo -u ubuntu -H git status --porcelain)" ]; then
            echo "The server checkout has local changes; refusing to overwrite them:" >&2
            sudo -u ubuntu -H git status --short >&2
            exit 1
          fi
          sudo -u ubuntu -H git fetch --prune origin
          sudo -u ubuntu -H git checkout -q main
          sudo -u ubuntu -H git reset -q --hard "$GITHUB_SHA"
          sudo -u ubuntu -H env COLLECTSTATIC='${{ inputs.collectstatic }}' bash scripts/deploy.sh "$GITHUB_SHA"
          EOF
